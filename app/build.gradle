plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anas.x100zoom'
    compileSdk 36

    defaultConfig {
        applicationId 'com.anas.x100zoom'
        minSdk 30
        targetSdk 36
        versionCode 9
        versionName '0.9-flash-grid-album'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
