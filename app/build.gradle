plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anas.x100zoom'
    compileSdk 36

    defaultConfig {
        applicationId 'com.anas.x100zoom'
        minSdk 30
        targetSdk 36
        versionCode 4
        versionName '0.4-tele-handoff-50x-modes'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
