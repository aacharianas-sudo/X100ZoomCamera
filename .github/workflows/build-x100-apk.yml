name: Build X100 Zoom Camera APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract Android project
        run: unzip -q -o X100ZoomCamera-source.zip

      - name: Build debug APK
        working-directory: X100ZoomCamera
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X100ZoomCamera-debug
          path: X100ZoomCamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
